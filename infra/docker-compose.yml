services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app_migrator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-seredina}
    ports:
      # Host-only: `worker` (host networking) reaches it at localhost; nothing
      # outside this machine needs the database. DB_BIND=0.0.0.0 to expose it.
      - '${DB_BIND:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      # Host-only, same reason as postgres -- and Redis here has no password,
      # so publishing it on every interface would hand anyone on the network
      # the queues and live-update channels.
      - '${DB_BIND:-127.0.0.1}:${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-app_migrator}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-seredina}
      APP_TENANT_DB_PASSWORD: ${APP_TENANT_DB_PASSWORD:?set APP_TENANT_DB_PASSWORD in .env}

  api:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.api
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://app_tenant:${APP_TENANT_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-seredina}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env}
      SEREDINA_MODE: ${SEREDINA_MODE:-self_hosted}
      CORS_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}
      # Same value as CORS_ORIGIN above, but read directly (not just as CORS policy)
      # to build the web app's own public links -- e.g. a CSAT survey link, see
      # docs/adr/0045-csat-surveys.md.
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}
      SENTRY_DSN: ${SENTRY_DSN:-}
      AI_PROVIDER: ${AI_PROVIDER:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      # AI_PROVIDER=ollama pointing at a host-machine Ollama install (not
      # another compose service) needs host.docker.internal, not localhost --
      # this container's own "localhost" is itself, not the host, on the
      # bridge network `api` runs on (unlike `worker` below, which uses host
      # networking for a different reason). e.g.
      # OLLAMA_BASE_URL=http://host.docker.internal:11434/v1
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      # Only required to connect a Telegram bot (docs/adr/0044-telegram-
      # channel.md) -- must be the real, internet-reachable HTTPS address this
      # container is reachable at, e.g. https://api.yourcompany.com. Also the
      # address the Devices page puts in agent enrollment commands. Set by
      # scripts/configure-address.sh (https://<your address>/api).
      API_PUBLIC_URL: ${API_PUBLIC_URL:-}
      # Requests reach the API through the web container's nginx (and, with
      # the `proxy` profile, Caddy): trust X-Forwarded-For only from private
      # addresses, so per-IP rate limits see the real client -- see index.ts.
      TRUST_PROXY: ${TRUST_PROXY:-loopback,uniquelocal}
      # A CA certificate agents should pin for a non-public server certificate
      # (the Devices page puts it in the enrollment command). configure-address.sh sets it
      # for the `internal` and `custom` TLS modes; empty = publicly trusted.
      TLS_CA_FILE: ${TLS_CA_FILE:-}
      # An internal mirror of the agent's release files, for devices that can't
      # reach GitHub; empty = download from GitHub.
      AGENT_DOWNLOAD_URL: ${AGENT_DOWNLOAD_URL:-}
    volumes:
      # Read-only: only to hand agents the CA certificate above, never keys --
      # see modules/devices/agentSetup.ts.
      - caddy_data:/caddy-data:ro
      - ../certs:/certs:ro
    ports:
      # With the `proxy` profile, configure-address.sh sets API_BIND=127.0.0.1
      # so the only way in from the network is through HTTPS on the proxy.
      - '${API_BIND:-0.0.0.0}:${API_PORT:-4000}:4000'

  worker:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.worker
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      # network_mode: host below means this container shares the HOST's network
      # namespace, not the compose bridge network -- postgres/redis's service-name
      # DNS ("postgres", "redis") does not resolve here. Connecting via the host's
      # own mapped ports instead works precisely because those services already
      # publish to the host via `ports:`.
      DATABASE_URL: postgresql://app_tenant:${APP_TENANT_DB_PASSWORD}@localhost:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-seredina}
      REDIS_URL: redis://localhost:${REDIS_PORT:-6379}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env}
      EMAIL_POLL_INTERVAL_MS: ${EMAIL_POLL_INTERVAL_MS:-30000}
      # Links in customer emails (the portal) -- same value as `api`'s.
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}
      SENTRY_DSN: ${SENTRY_DSN:-}
      # Must match `api`'s -- the worker refuses to run network scans outside
      # self_hosted mode (docs/adr/0055-agent-based-discovery.md).
      SEREDINA_MODE: ${SEREDINA_MODE:-self_hosted}
    # Agentless discovery (see docs/adr/0002-agentless-discovery.md) needs to reach
    # whatever LAN an operator asks it to scan -- host networking is the pragmatic
    # default for a self-hosted deployment. Linux-only; on Docker Desktop
    # (Mac/Windows) this silently falls back to the container's own isolated
    # network, so discovery jobs there will find nothing outside the compose network.
    network_mode: host

  web:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.web
      args:
        # Leave empty (the default): the console then reaches the API at /api on
        # whatever address it was opened at -- this container's nginx proxies it
        # (docs/adr/0054-server-address-and-tls.md). Only set it to point the
        # console at an API on a different origin; it's baked in at build time.
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
    depends_on:
      - api
    ports:
      # Same as API_BIND: host-only once the `proxy` profile is in front.
      - '${WEB_BIND:-0.0.0.0}:${WEB_PORT:-8080}:80'

  # Optional HTTPS entry point (docs/adr/0054-server-address-and-tls.md):
  # `COMPOSE_PROFILES=proxy` in .env (scripts/configure-address.sh sets it).
  # Terminates TLS for your address -- Let's Encrypt, your own certificate, or
  # a generated internal CA -- and forwards everything to `web`.
  proxy:
    profiles: ['proxy']
    image: caddy:2.10-alpine
    depends_on:
      - web
    environment:
      SEREDINA_SITE: ${SEREDINA_SITE:-localhost}
      TLS_MODE: ${TLS_MODE:-internal}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/tls:/etc/caddy/tls:ro
      - ../certs:/certs:ro
      # Issued certificates and the internal CA -- must survive restarts, or
      # Let's Encrypt rate limits and re-trusting a new CA become a problem.
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

  # Optional, profile-gated: the MCP server's Streamable HTTP transport (see
  # docs/adr/0035-mcp-http-transport.md). Unlike the stdio transport (meant to
  # be spawned on demand by an MCP client that owns its stdin/stdout, e.g.
  # `docker run -i` from Claude Desktop's own config -- see README's "MCP
  # server" section), HTTP is a genuine always-on network service, so it fits
  # this file. Not started by a plain `docker compose up`; run with
  # `docker compose --profile mcp up` once an operator actually wants to
  # expose it to their own agents.
  mcp-server-http:
    profiles: ['mcp']
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.mcp-server
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      MCP_TRANSPORT: http
      MCP_HTTP_PORT: 3100
      DATABASE_URL: postgresql://app_tenant:${APP_TENANT_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-seredina}
      REDIS_URL: redis://redis:6379
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env}
    ports:
      - '${MCP_HTTP_PORT:-3100}:3100'

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
