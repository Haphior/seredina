name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege default for the job's GITHUB_TOKEN: this workflow only
# checks out code and runs tests against disposable service containers, it
# never pushes, comments, or touches packages/Pages.
permissions:
  contents: read

# Mirrors infra/docker/migrate-entrypoint.sh's real bootstrap sequence
# (prisma migrate deploy -> create/alter app_tenant -> apply RLS policies ->
# seed permissions) rather than reinventing it, so CI can never silently
# drift from what a real deploy actually runs. Every credential here is a
# fixed, throwaway value that only ever touches this job's own disposable
# Postgres container -- never a GitHub secret, since there is nothing real
# to protect.
env:
  DATABASE_URL: postgresql://app_migrator:ci_migrator_password@localhost:5432/seredina?schema=public
  APP_TENANT_DB_PASSWORD: ci_tenant_password
  APP_TENANT_DATABASE_URL: postgresql://app_tenant:ci_tenant_password@localhost:5432/seredina?schema=public
  REDIS_URL: redis://localhost:6379
  JWT_SECRET: ci-test-jwt-secret-not-for-production-0000000000000000
  ENCRYPTION_KEY: e9abda8d1436f23aee152512e7706d28f3eb3fd60634bc755097dab6cf83431d

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: app_migrator
          POSTGRES_PASSWORD: ci_migrator_password
          POSTGRES_DB: seredina
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app_migrator"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install postgresql-client (for migrate-entrypoint.sh's psql calls)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Install dependencies
        run: npm ci

      # LocalEmbeddingAdapter (packages/ai-adapters) downloads a real ~90MB
      # ONNX model from HuggingFace on first use (see docs/adr/0032-rag-
      # knowledge-base-search.md) -- cached here so every CI run after the
      # first doesn't re-download it. Default cache location per the
      # library's own docs: `.cache` relative to its installed path.
      - name: Cache the local embedding model
        uses: actions/cache@v6
        with:
          path: node_modules/@huggingface/transformers/.cache
          key: huggingface-minilm-l6-v2

      - name: Build shared workspace packages
        run: |
          npm run build --workspace=packages/shared
          npm run prisma:generate --workspace=packages/db
          npm run build --workspace=packages/db
          npm run build --workspace=packages/ai-adapters

      - name: Migrate + apply RLS policies + seed permissions
        working-directory: packages/db
        run: bash ../../infra/docker/migrate-entrypoint.sh

      - name: Typecheck every workspace
        run: |
          npx tsc -p apps/api/tsconfig.test.json --noEmit
          npx tsc -p apps/web/tsconfig.json --noEmit
          npx tsc -p apps/worker/tsconfig.json --noEmit
          npx tsc -p apps/mcp-server/tsconfig.json --noEmit
          npx tsc -p packages/ai-adapters/tsconfig.json --noEmit

      - name: apps/api test suite (includes RLS isolation + fuzz tests)
        working-directory: apps/api
        run: npx vitest run
        env:
          DATABASE_URL: ${{ env.APP_TENANT_DATABASE_URL }}

      - name: packages/ai-adapters test suite
        working-directory: packages/ai-adapters
        run: npx vitest run

  # Builds every image in infra/docker-compose.yml and brings the real stack
  # up (migrate -> api -> worker -> web), then registers a tenant through the
  # console's /api proxy. Catches what the unit job can't: a Dockerfile that
  # forgets a workspace package, a broken migrate entrypoint, nginx config.
  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Build and smoke-test the compose stack
        run: bash scripts/compose-smoke.sh

  # The same smoke test with infra/docker-compose.desktop.yml on top: the
  # layout Docker Desktop (Windows Server, macOS) uses, where the worker is
  # on the compose network instead of host networking.
  # See docs/adr/0075-windows-docker-desktop.md.
  compose-smoke-desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Build and smoke-test the compose stack, Docker Desktop layout
        run: bash scripts/compose-smoke.sh
        env:
          SMOKE_EXTRA_COMPOSE: infra/docker-compose.desktop.yml

  # Installs the previous release, fills it with data through its API,
  # upgrades it with this code's migrations, and fails if any existing row
  # changed or if the old data can't be read back through the new API.
  # See scripts/upgrade-check.sh and docs/adr/0074-upgrade-check.md.
  upgrade-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: app_migrator
          POSTGRES_PASSWORD: ci_migrator_password
          POSTGRES_DB: seredina
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app_migrator"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7
        with:
          # The release tags are what it upgrades from.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install postgresql-client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Upgrade from the previous release
        run: bash scripts/upgrade-check.sh
