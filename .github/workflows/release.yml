name: Release

# Publishes a Seredina release: the vX.Y.Z tag on the commit it runs on, and
# a GitHub release whose notes are that version's CHANGELOG section. Run it
# by hand (Actions -> Release -> Run workflow) on main with the version, or
# push a v* tag. It refuses a version that doesn't match package.json or has
# no CHANGELOG section, so a release always says what it contains.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v0.2.0 (must match package.json)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check the version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION:-$GITHUB_REF_NAME}"
          echo "$version" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' || { echo "::error::not a version: $version"; exit 1; }
          pkg="v$(node -p "require('./package.json').version")"
          [ "$pkg" = "$version" ] || { echo "::error::package.json says $pkg, not $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Release notes from CHANGELOG.md
        run: |
          # The lines under "## [X.Y.Z]" up to the next "## [" heading.
          awk -v v="${VERSION#v}" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::CHANGELOG.md has no section for ${VERSION#v}"; exit 1; }
          cat >> notes.md <<EOF

          ## Install or update

          See the guide, "Updates and backups", in the documentation. In short:

          \`\`\`bash
          git fetch --tags && git checkout $VERSION
          docker compose -f infra/docker-compose.yml up -d --build
          \`\`\`

          Back up the database first. Migrations run on start and only go forward.
          EOF

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          # A pushed tag already exists; a manual run creates it on this commit.
          gh release create "$VERSION" --target "$GITHUB_SHA" --notes-file notes.md $prerelease \
            --title "Seredina $VERSION"

  # The Android agent's APK, attached to the release so phones can download
  # it from the Devices page's QR (docs/adr/0078-mobile-inventory.md). Signed
  # with the ANDROID_KEYSTORE_* secrets: the same key on every release is
  # what lets a phone install an update over the version it has. Without
  # them it's signed with a one-off key and the run warns -- installable,
  # but a later APK signed differently has to replace it by uninstalling.
  android-apk:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14.3"

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          keystore="$RUNNER_TEMP/release.jks"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$keystore"
            {
              echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
              echo "ANDROID_KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: signing the APK with a one-off key. Phones will have to uninstall it before installing a later release. See docs: Android agent."
            pass="$(openssl rand -hex 16)"
            echo "::add-mask::$pass"
            keytool -genkeypair -keystore "$keystore" -storepass "$pass" -keypass "$pass" -alias seredina \
              -keyalg RSA -keysize 3072 -validity 10000 -dname "CN=Seredina Agent" -noprompt
            {
              echo "ANDROID_KEYSTORE_PASSWORD=$pass"
              echo "ANDROID_KEY_ALIAS=seredina"
              echo "ANDROID_KEY_PASSWORD=$pass"
            } >> "$GITHUB_ENV"
          fi
          echo "ANDROID_KEYSTORE_FILE=$keystore" >> "$GITHUB_ENV"

      - name: Build the release APK
        run: gradle -p apps/agent-android --no-daemon testReleaseUnitTest assembleRelease

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION:-$GITHUB_REF_NAME}"
          cp apps/agent-android/app/build/outputs/apk/release/app-release.apk seredina-agent-android.apk
          sha256sum seredina-agent-android.apk > seredina-agent-android.apk.sha256
          gh release upload "$version" seredina-agent-android.apk seredina-agent-android.apk.sha256 --clobber
