# Dependabot's security updates follow this file too. A major version of a
# build tool can need code changes (Tailwind 3 -> 4 broke the console's build
# in #20), so those come in by hand, not from a bot PR.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: tailwindcss
        update-types: ['version-update:semver-major']
      # Tailwind 3 needs 6.x. GHSA-rj75-hqrm-r3gf lists only 7.1.6 as fixed,
      # so Dependabot moves Tailwind to 4 to reach it; 6.1.5 has the backport.
      - dependency-name: postcss-selector-parser
        update-types: ['version-update:semver-major']
      - dependency-name: vite
        update-types: ['version-update:semver-major']
      - dependency-name: '@vitejs/plugin-react'
        update-types: ['version-update:semver-major']
      - dependency-name: react
        update-types: ['version-update:semver-major']
      - dependency-name: react-dom
        update-types: ['version-update:semver-major']
      - dependency-name: prisma
        update-types: ['version-update:semver-major']
      - dependency-name: '@prisma/client'
        update-types: ['version-update:semver-major']
      - dependency-name: fastify
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
